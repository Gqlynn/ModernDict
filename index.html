<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试页面 · 部署成功</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #f6f4ef;
      color: #2b2b2b;
    }
    main { text-align: center; padding: 24px; }
    .badge { font-size: 64px; line-height: 1; margin-bottom: 8px; }
    h1 { margin: 0 0 14px; font-size: clamp(28px, 6vw, 52px); letter-spacing: 4px; }
    p { margin: 8px 0; color: #777; font-size: 14px; }
    code { color: #8e1616; word-break: break-all; }
    strong { color: #444; }
    button {
      margin-top: 20px;
      padding: 10px 24px;
      font-size: 16px;
      border: 1px solid #8e1616;
      color: #8e1616;
      background: #fff;
      border-radius: 999px;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    #count { font-weight: 700; }
    footer {
      position: fixed;
      bottom: 14px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">🌐</div>
    <h1>测试页面</h1>
    <p>如果你能看到这一页，说明网站部署成功了。</p>
    <p>当前地址：<code id="url"></code></p>
    <p>现在是：<strong id="time"></strong></p>
    <button id="btn" type="button">点我一下（<span id="count">0</span>）</button>
  </main>
  <footer>只有一个 HTML 文件，没有任何依赖</footer>

  <script>
    document.getElementById('url').textContent = location.href;

    function tick() {
      var now = new Date();
      document.getElementById('time').textContent = now.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }
    tick();
    setInterval(tick, 1000);

    var count = 0;
    document.getElementById('btn').addEventListener('click', function () {
      count += 1;
      document.getElementById('count').textContent = count;
    });
  </script>
</body>
</html>
